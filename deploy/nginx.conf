server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. The Content-Security-Policy mirrors the app's built-in
  # policy (see packages/core/src/security/csp.ts) as defense-in-depth — served
  # as a real header it also enforces frame-ancestors. connect-src 'none' is the
  # no-egress guarantee: the served app cannot open any network connection.
  #
  # IMPORTANT: caching below is set with `expires` (NOT `add_header`). In nginx,
  # a `location` that contains ANY `add_header` stops inheriting these
  # server-level `add_header` directives — which would silently strip the CSP and
  # other security headers from /assets/* and /index.html. `expires` sets
  # Cache-Control without triggering that inheritance reset, so every response
  # keeps the full security header set.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
  # Isolate our browsing context group and forbid other origins from embedding
  # our resources (XS-Leaks / cross-origin defense-in-depth).
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # Long-cache fingerprinted assets; never cache the HTML entry. `expires` only
  # (see the note above) so security headers still apply to these responses.
  location /assets/ {
    expires 1y;
  }

  location = /index.html {
    expires -1; # Cache-Control: no-cache
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;
}
