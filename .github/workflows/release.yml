name: Release

# A release is triggered by a *merge into main* (main is protected — no direct
# pushes). Every push to main is inspected; a release runs only when main's
# current version has no release yet. So merging a `pnpm bump` PR ships a release,
# while any other merge is a fast no-op. This keeps the trigger idempotent.
on:
  push:
    branches: [main]

# Never let a later merge cancel an in-flight release.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # create the tag, the GitHub Release, and upload assets
  packages: write # push the Docker image to GHCR

env:
  PNPM_VERSION: 11.17.0
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------------------
  # 1. Decide whether this merge should release. Cheap — runs on every push.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the current version needs a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$VERSION already exists — nothing to do."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

          # Only when we're actually about to release do we insist the four
          # version files agree — `pnpm bump` keeps them in lockstep, so a
          # mismatch here means someone hand-edited one of them.
          CONF=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fail=0
          for pair in "src-tauri/tauri.conf.json:$CONF" "src-tauri/Cargo.toml:$CARGO"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ "$val" != "$VERSION" ]; then
              echo "::error::$name version ($val) != package.json ($VERSION). Use 'pnpm bump' so every version file stays in lockstep."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "✓ Releasing v$VERSION."

  # ---------------------------------------------------------------------------
  # 2. Quality gate — reuse the CI checks before we build anything shippable.
  # ---------------------------------------------------------------------------
  gate:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify no-egress CSP is present in the production build
        run: |
          if grep -q "connect-src 'none'" packages/host/dist/index.html; then
            echo "✓ Strict no-egress CSP present."
          else
            echo "::error::Production build is missing connect-src 'none' — the no-egress guarantee is broken."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 3. Create the (draft) release + tag at this merge commit.
  # ---------------------------------------------------------------------------
  create-release:
    needs: [detect, gate]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so generated notes can diff the previous tag
      - name: Create draft release (tags the merge commit)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # --target pins the tag to this exact merge commit, so no branch push
          # is needed — protected main is never written to directly.
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Nexine v$VERSION" \
            --generate-notes \
            ${{ needs.detect.outputs.prerelease == 'true' && '--prerelease' || '' }}

  # ---------------------------------------------------------------------------
  # 4. Desktop installers for every OS, built with Tauri and uploaded as assets.
  # ---------------------------------------------------------------------------
  desktop:
    needs: [detect, gate, create-release]
    if: needs.detect.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: '--target universal-apple-darwin'
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Tauri (WebKitGTK) + keyring (libsecret / D-Bus Secret Service) build deps.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libappindicator3-dev \
            libsecret-1-dev \
            libdbus-1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - run: pnpm install --frozen-lockfile

      - name: Build desktop app and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: v${{ needs.detect.outputs.version }}
          releaseName: Nexine v${{ needs.detect.outputs.version }}
          releaseDraft: true
          prerelease: ${{ needs.detect.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # 5. Web static bundle (zip) + CLI tarball — attached to the same release.
  # ---------------------------------------------------------------------------
  web-and-cli:
    needs: [detect, gate, create-release]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build web bundle and CLI
        run: |
          pnpm build
          pnpm --filter @nexine/cli build

      - name: Package the web bundle (built output only — no dev/source files)
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # Zip the *contents* of dist so it unpacks to index.html at the root.
          # dist is Vite's clean build output; it contains no source or dev files.
          ( cd packages/host/dist && zip -r "$GITHUB_WORKSPACE/nexine-web-v${VERSION}.zip" . )

      - name: Package the CLI tarball (dist + manifest only)
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          cd packages/cli
          # dist/bin.js bundles all @nexine/* workspace code (see build.mjs); esbuild
          # is the only real runtime dependency. Strip the unresolvable `workspace:*`
          # entries and stamp the release version so the tarball installs standalone.
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.env.VERSION;
            p.dependencies = Object.fromEntries(
              Object.entries(p.dependencies || {}).filter(([, v]) => !String(v).startsWith("workspace:")),
            );
            delete p.private;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          TARBALL=$(npm pack --silent)
          mv "$TARBALL" "$GITHUB_WORKSPACE/nexine-cli-v${VERSION}.tgz"

      - name: Upload web + CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          gh release upload "v$VERSION" \
            "nexine-web-v${VERSION}.zip" \
            "nexine-cli-v${VERSION}.tgz" \
            --clobber

  # ---------------------------------------------------------------------------
  # 6. Docker image → GitHub Container Registry (GHCR).
  # ---------------------------------------------------------------------------
  docker:
    needs: [detect, gate]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${IMAGE}:${VERSION}"
          # Only a stable (non-prerelease) build moves the :latest tag.
          if [ "${{ needs.detect.outputs.prerelease }}" = "false" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false

  # ---------------------------------------------------------------------------
  # 7. Publish the release once every artefact has landed.
  # ---------------------------------------------------------------------------
  finalize:
    needs: [detect, desktop, web-and-cli, docker]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          gh release edit "v$VERSION" \
            --draft=false \
            ${{ needs.detect.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}
