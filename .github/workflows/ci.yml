name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify no-egress CSP is present in the production build
        run: |
          if grep -q "connect-src 'none'" packages/host/dist/index.html; then
            echo "✓ Strict no-egress CSP present."
          else
            echo "::error::Production build is missing connect-src 'none' — the no-egress guarantee is broken."
            exit 1
          fi
