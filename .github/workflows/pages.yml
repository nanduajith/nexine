name: Deploy docs site + app demo to GitHub Pages

# Publishes to GitHub Pages:
#   /<repo>/      → the static documentation site (site/)
#   /<repo>/app/  → a live, in-browser demo of the Nexine app
# The demo is convenient for "try before you install"; it is NOT the hardened
# deployment (GitHub Pages cannot send HTTP security headers, so frame-ancestors
# / COOP / CORP are absent). The no-egress CSP still holds — it ships in the
# app's <meta> tag — and is asserted below. For production, use the desktop app
# or self-host (deploy/nginx.conf sends the full header set).
#
# Enable Pages with "GitHub Actions" as the source once, in Settings → Pages.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.17.0
  NODE_VERSION: 22
  # The project site is served under /<repo>/, so the app demo lives at
  # /<repo>/app/. Vite reads this to prefix asset URLs (see vite.config.ts).
  NEXINE_BASE: /nexine/app/

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the app for the Pages subpath
        env:
          NEXINE_TARGET: web
        run: pnpm build # NEXINE_BASE (env, above) prefixes assets with /nexine/app/

      - name: Generate test coverage badge
        run: |
          pnpm test:coverage
          pnpm exec make-coverage-badge

      - name: Verify the no-egress CSP is present in the demo build
        run: |
          if grep -q "connect-src 'none'" packages/host/dist/index.html; then
            echo "✓ Strict no-egress CSP present in the app demo."
          else
            echo "::error::App demo build is missing connect-src 'none' — the no-egress guarantee is broken."
            exit 1
          fi

      - name: Assemble the Pages bundle (docs at root, app under /app)
        run: |
          rm -rf _site
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r packages/host/dist/. _site/app/
          cp coverage/badge.svg _site/coverage.svg || true

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
